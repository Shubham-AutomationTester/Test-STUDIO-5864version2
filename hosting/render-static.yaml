      - path: "/cases/h01/"
        name: "X-Robots-Tag"
        value: "noindex"
      - path: "/cases/h01/index.html"
        name: "X-Robots-Tag"
        value: "noindex"
      - path: "/cases/h02/"
        name: "X-Robots-Tag"
        value: "nofollow"
